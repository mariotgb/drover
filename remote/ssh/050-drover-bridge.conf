# Drover bridge: sshd hardening for reaching this Mac from the iPhone via the VPS.
# Installed as /etc/ssh/sshd_config.d/050-drover-bridge.conf by ../install.sh ssh.
#
# How precedence works here (checked with check-sshd.sh, not assumed):
#  - /etc/ssh/sshd_config includes sshd_config.d/* at the top, in filename order.
#    For most keywords sshd keeps the FIRST value it reads, so these settings win
#    over macOS's own 100-macos.conf and over the main file.
#  - AllowUsers is the exception: lists from several files are merged, so another
#    file can only ADD users. check-sshd.sh asserts the merged list is exactly the configured Mac user.
#  - A matching "Match" block elsewhere can still override global values.
#    check-sshd.sh asserts the effective values, it does not just print them.

PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
AllowUsers __MAC_USER__
